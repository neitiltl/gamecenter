<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Game Center: Index</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <h1 th:text="'Welcome to the Game Center'">Welcome</h1>

    <br>

    <p>
        <a href="/newgame" class="btn btn-primary">Add new game</a>
    </p>

    <p>
        <a href="/gamelist" class="btn btn-primary">List All Games</a>
    </p>

    <br>

    <p>
        <a href="/platformlist" class="btn btn-primary">List All Platforms</a>
    </p>
    <p>
        <a href="/createplatform" class="btn btn-primary">Add New Platform</a>
    </p>

    <br>

    <p>

        <input type="submit" value="Sign Out" class="btn btn-danger" />
    </form>
    </p>

</html>
