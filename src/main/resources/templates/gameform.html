<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Game Center: Game Form</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <h1>Add New Game </h1>

    <br>

    <form action="#" th:action="@{/savegame}" th:object="${game}" method="post">
        <label for="id"></label>

        <input type="hidden" id="id" th:field="*{id}" readonly="readonly" />

        <p>Name: <input type="text" th:field="*{name}" />
            <span th:if="${#fields.hasErrors('name')}">Name is required and must be between 2 and 50 characters
                long</span>
        </p>


        <p>Publisher: <input type="text" th:field="*{publisher}" /></p>

        <p>Year: <input type="number" th:field="*{publishingYear}" />
            <span th:if="${#fields.hasErrors('publishingYear')}">Year must be between 1950 and 2050</span>
        </p>

        <p>Description: <input type="text" th:field="*{description}" />
            <span th:if="${#fields.hasErrors('description')}">Description must be no more than 750 characters
                long</span>
        </p>


        <label for="platformlist">Platform: </label>
        <select id="platformlist" th:field="*{platform}" class="form-control">
            <option th:each="platform: ${platforms}" th:value="${platform.platformId}" th:text="${platform.name}">
            </option>
        </select>

        <br>

        <p><input type="submit" class="btn btn-primary" value="Save game" /></p>
    </form>


</body>

</html>
