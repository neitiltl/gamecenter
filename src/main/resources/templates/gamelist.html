<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Game Center: List of Games</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <header th:replace="fragments/header :: header"></header>
    <div th:replace="fragments/navigation :: navigation"></div>

    <main class="container mt-4">
        <h1>Games</h1>
        <p sec:authorize="hasAnyAuthority('USER', 'ADMIN')">
            Logged in as <span sec:authentication="name"></span>.</p>
        <br>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Publisher</th>
                    <th>Year</th>
                    <th>Description</th>
                    <th>Platform</th>

                </tr>
            </thead>

            <tbody>
                <tr th:each="game : ${games}">
                    <td th:text="${game.name}"></td>
                    <td th:text="${game.publisher}"></td>
                    <td th:text="${game.publishingYear}"></td>
                    <td th:text="${game.description}"></td>
                    <td th:text="${game.platform.name}"></td>


                    <td sec:authorize="hasAnyAuthority('USER', 'ADMIN')"> <a th:href="@{/edit/{id}(id=${game.id})}"
                            class="btn btn-warning">Edit</a></td>
                    <td sec:authorize="hasAuthority('ADMIN')"><a th:href="@{/delete/{id}(id=${game.id})}"
                            class="btn btn-danger">Delete</a></td>

                </tr>
            </tbody>
        </table>
        <br>

        <p>
            <a sec:authorize="hasAnyAuthority('USER', 'ADMIN')" href="/newgame" class="btn btn-primary">Add new game</a>
        </p>
        <br>

        <p>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <input type="submit" value="Sign Out" class="btn btn-danger" />
        </form>
        </p>

    </main>
    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
