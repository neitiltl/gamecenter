<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Game Center: Last Game Added</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <h1 th:text="'Game Saved: '">Game</h1>
    <br>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Publisher</th>
                <th>Year</th>
                <th>Description</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td th:text="${game.name}"></td>
                <td th:text="${game.publisher}"></td>
                <td th:text="${game.publishingYear}"></td>
                <td th:text="${game.description}"></td>
                <td th:text="${game.platform.name}"></td>

                <td> <a th:href="@{/edit/{id}(id=${game.id})}" class="btn btn-warning">Edit</a></td>
                <td><a th:href="@{/delete/{id}(id=${game.id})}" class="btn btn-danger">Delete</a></td>
            </tr>
        </tbody>
    </table>

    <br>

    <p>
        <a href="/newgame" class="btn btn-primary">Add new game</a>
    </p>

    <p>
        <a href="/gamelist" class="btn btn-primary">List All Games</a>
    </p>

</body>

</html>
