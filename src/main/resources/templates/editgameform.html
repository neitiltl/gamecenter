<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Game Center: Game Form</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <header th:replace="fragments/header :: header"></header>
    <div th:replace="fragments/navigation :: navigation"></div>

    <main class="container mt-4">
        <h1>Edit Game </h1>

        <br>

        <form action="#" th:action="@{/savegame}" th:object="${game}" method="post">

            <label for="id"></label>
            <input type="hidden" id="id" th:field="*{id}" readonly="readonly" />

            <p>Name: <input type="text" th:field="*{name}" /></p>
            <p>Publisher: <input type="text" th:field="*{publisher}" /></p>
            <p>Year: <input type="number" th:field="*{publishingYear}" /></p>
            <p>Description: <input type="text" th:field="*{description}" /></p>

            <label for="platformlist">Platform: </label>
            <select id="platformlist" th:field="*{platform.platformId}" class="form-control">
                <option th:each="platform: ${platforms}" th:value="${platform.platformId}" th:text="${platform.name}">
                </option>
            </select>

            <br>

            <p><input type="submit" class="btn btn-primary" value="Save game" /></p>
        </form>

    </main>

    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
